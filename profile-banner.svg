<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Dhruv Davda — Cracked Developer">
  <defs>
    <!-- mint→white gradient for the headline -->
    <linearGradient id="head" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7DFFB2"/>
      <stop offset=".55" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#7DFFB2"/>
    </linearGradient>

    <!-- subtle blueprint grid -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity=".04" stroke-width="1"/>
    </pattern>

    <!-- soft mint radial -->
    <radialGradient id="halo" cx="50%" cy="62%" r="55%">
      <stop offset="0" stop-color="#7DFFB2" stop-opacity=".10"/>
      <stop offset="1" stop-color="#7DFFB2" stop-opacity="0"/>
    </radialGradient>

    <!-- vignette -->
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset=".55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".55"/>
    </radialGradient>

    <!-- soft glow filter -->
    <filter id="glow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background stack -->
  <rect width="1280" height="360" fill="#03040a"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#halo)"/>
  <rect width="1280" height="360" fill="url(#vig)"/>

  <!-- corner crosshairs (CAD blueprint vibe) -->
  <g stroke="#7DFFB2" stroke-opacity=".55" stroke-width="1.4" fill="none">
    <path d="M28 28 H62 M28 28 V62"/>
    <path d="M1252 28 H1218 M1252 28 V62"/>
    <path d="M28 332 H62 M28 332 V298"/>
    <path d="M1252 332 H1218 M1252 332 V298"/>
  </g>

  <!-- top-left identifier with live status -->
  <g font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="13">
    <text x="76" y="58" fill="#FFFFFF" fill-opacity=".42">~/dhruv.davda</text>
    <text x="76" y="58" fill="#FFFFFF" fill-opacity=".42" dx="120">·</text>
    <text x="76" y="58" fill="#7DFFB2" dx="138">main</text>
    <text x="76" y="58" fill="#FFFFFF" fill-opacity=".42" dx="180">·</text>
    <text x="76" y="58" fill="#FFFFFF" fill-opacity=".62" dx="198">building stradix.site</text>

    <circle cx="1232" cy="54" r="5" fill="#7DFFB2">
      <animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="1218" y="58" text-anchor="end" fill="#7DFFB2" letter-spacing="2">ONLINE</text>
  </g>

  <!-- prompt line -->
  <g font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="14">
    <text x="76" y="118" fill="#FFFFFF" fill-opacity=".40">$</text>
    <text x="92" y="118" fill="#FFFFFF" fill-opacity=".75">whoami</text>
    <text x="76" y="142" fill="#7DFFB2">→ dhruv.davda · cracked developer</text>
    <rect x="316" y="129" width="9" height="14" fill="#7DFFB2">
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ⚙️ HEADLINE: CRACKED DEVELOPER -->
  <g filter="url(#glow)">
    <text
      x="640" y="232"
      text-anchor="middle"
      font-family="'Space Grotesk', 'Inter', system-ui, -apple-system, sans-serif"
      font-weight="700"
      font-size="116"
      letter-spacing="-4"
      fill="url(#head)">
      CRACKED&#160;DEVELOPER
    </text>
  </g>

  <!-- chromatic ghost layer (subtle 'cracked' offset) -->
  <text
    x="638" y="232"
    text-anchor="middle"
    font-family="'Space Grotesk', 'Inter', system-ui, -apple-system, sans-serif"
    font-weight="700"
    font-size="116"
    letter-spacing="-4"
    fill="#7DFFB2"
    fill-opacity=".18">
    CRACKED&#160;DEVELOPER
  </text>

  <!-- name + tags row -->
  <text
    x="640" y="272"
    text-anchor="middle"
    font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace"
    font-size="13"
    letter-spacing="6"
    fill="#FFFFFF" fill-opacity=".55">
    DHRUV  DAVDA  ·  TYPESCRIPT  ·  AGENTS  ·  DEV  TOOLING
  </text>

  <!-- bottom info row -->
  <g font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">
    <text x="76" y="324" fill="#FFFFFF" fill-opacity=".40">SCALER × BITS PILANI</text>
    <text x="76" y="324" dx="220" fill="#FFFFFF" fill-opacity=".22">|</text>
    <text x="76" y="324" dx="240" fill="#FFFFFF" fill-opacity=".55">SDE INTERN · SCALER AI LABS</text>
    <text x="76" y="324" dx="450" fill="#FFFFFF" fill-opacity=".22">|</text>
    <text x="76" y="324" dx="470" fill="#7DFFB2" fill-opacity=".85">700+ DSA · 14 PRs</text>

    <text x="1218" y="324" text-anchor="end" fill="#7DFFB2" fill-opacity=".85">STRADIX.SITE  ↗</text>
  </g>

  <!-- animated scanline -->
  <rect x="0" y="0" width="1280" height="2" fill="#7DFFB2" fill-opacity=".18">
    <animate attributeName="y" values="0;360;0" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
